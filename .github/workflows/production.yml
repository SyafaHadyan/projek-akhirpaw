name: CD - Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image-nginx:
    name: Build & Push Nginx Image
    uses: ./.github/workflows/image-nginx.yml
    with:
      tag: nginx-latest
    secrets: inherit

  build-image-php:
    name: Build & Push PHP Image
    uses: ./.github/workflows/image-php.yml
    with:
      tag: php-latest
    secrets: inherit
